name: Update results and publish site

# Fetches the latest AFL results from Squiggle and publishes the site to GitHub Pages.
# Requires: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  schedule:
    - cron: "*/15 * * 3-9 *"            # every 15 minutes, March–September (cron is UTC)
    - cron: "17 3 * 1,2,10,11,12 *"     # once a day in the off-season

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch AFL results from Squiggle
        run: node scripts/fetch-results.mjs
        env:
          SQUIGGLE_CONTACT: ${{ vars.SQUIGGLE_CONTACT }}
        continue-on-error: true   # still publish the site if Squiggle is briefly down

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
